<title>YukiScripts Library</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout concept: dark hub with a searchable grid of script cards (thumbnail,
   title, id badge, tag pills). Clicking a card opens a full-source reader
   modal with copy — an editable personal script catalog, not a game loader. */
:root {
  --bg: #1b1b22;
  --surface: #24242e;
  --surface-2: #2c2c38;
  --border: #38384a;
  --fg: #f3f2f7;
  --fg-dim: #9896a8;
  --accent: #7c6cf0;
  --accent-2: #4fb8a0;
  --accent-soft: rgba(124, 108, 240, 0.14);
  --code-bg: #15151c;
  --code-fg: #e8e6f0;
  --font-display: 'Fraunces', Georgia, serif;
  --font-body: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  --font-mono: 'JetBrains Mono', 'SF Mono', Consolas, monospace;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #f4f3f8;
    --surface: #ffffff;
    --surface-2: #ececf3;
    --border: #dddbe8;
    --fg: #1d1c28;
    --fg-dim: #6c6a7c;
    --accent: #5d4fd6;
    --accent-2: #2f8e78;
    --accent-soft: rgba(93, 79, 214, 0.1);
    --code-bg: #1d1c28;
    --code-fg: #e8e6f0;
    color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #f4f3f8;
  --surface: #ffffff;
  --surface-2: #ececf3;
  --border: #dddbe8;
  --fg: #1d1c28;
  --fg-dim: #6c6a7c;
  --accent: #5d4fd6;
  --accent-2: #2f8e78;
  --accent-soft: rgba(93, 79, 214, 0.1);
  --code-bg: #1d1c28;
  --code-fg: #e8e6f0;
  color-scheme: light;
}

* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-body);
  margin: 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
body::before {
  content: "";
  position: fixed;
  inset: 0 0 auto;
  height: env(safe-area-inset-top, 0px);
  z-index: 20;
  background: var(--bg);
}

.wrap {
  max-width: 1120px;
  margin: 0 auto;
  padding-block: 24px 64px;
}

/* header / hero */
.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  margin-bottom: 28px;
}
.brand { display: flex; align-items: center; gap: 10px; }
.brand .mark {
  font-family: var(--font-mono);
  font-size: 13px;
  color: var(--accent);
  background: var(--accent-soft);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 4px 8px;
  cursor: default;
  user-select: none;
}
.brand h1 {
  font-family: var(--font-display);
  font-size: 19px;
  font-weight: 600;
  margin: 0;
}
.edit-toggle {
  font-family: var(--font-mono);
  font-size: 12.5px;
  background: var(--surface);
  border: 1px solid var(--border);
  color: var(--fg);
  border-radius: 8px;
  padding: 8px 14px;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 7px;
}
.edit-toggle:hover { border-color: var(--accent); color: var(--accent); }
.edit-toggle.on { background: var(--accent); border-color: var(--accent); color: #fff; }

.hero { text-align: center; margin-bottom: 28px; }
.hero .icon {
  width: 44px; height: 44px;
  border-radius: 12px;
  background: var(--accent-soft);
  border: 1px solid var(--border);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 10px;
  font-size: 20px;
}
.hero h2 {
  font-family: var(--font-display);
  font-size: clamp(26px, 4vw, 34px);
  font-weight: 600;
  margin: 0 0 6px;
  text-wrap: balance;
}
.hero p {
  color: var(--fg-dim);
  font-size: 14px;
  margin: 0;
  font-family: var(--font-mono);
}

.search-row { display: flex; justify-content: center; margin-bottom: 32px; }
.search-box {
  width: 100%;
  max-width: 520px;
  position: relative;
}
.search-box input {
  width: 100%;
  background: var(--surface);
  border: 1px solid var(--border);
  color: var(--fg);
  border-radius: 999px;
  padding: 12px 18px 12px 40px;
  font-size: 14px;
  font-family: var(--font-body);
}
.search-box input::placeholder { color: var(--fg-dim); }
.search-box input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
.search-box .icn {
  position: absolute;
  left: 14px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--fg-dim);
  font-size: 14px;
  pointer-events: none;
}

/* grid */
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
  gap: 18px;
}
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 14px;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  min-width: 0;
}
.thumb {
  aspect-ratio: 16/9;
  width: 100%;
  background: linear-gradient(135deg, var(--accent-soft), var(--surface-2));
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-mono);
  font-size: 28px;
  color: var(--accent);
  position: relative;
  min-width: 0;
}
.thumb img { width: 100%; height: 100%; object-fit: cover; }
.thumb .ph { opacity: 0.7; }

.card-body { padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.card-title {
  font-family: var(--font-display);
  font-size: 16px;
  font-weight: 600;
  margin: 0;
  text-align: center;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.card-id {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--fg-dim);
  text-align: center;
}
.card-tags {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  justify-content: center;
}
.pill {
  font-family: var(--font-mono);
  font-size: 10.5px;
  padding: 3px 9px;
  border-radius: 999px;
  color: var(--fg-dim);
  background: var(--surface-2);
  border: 1px solid var(--border);
}
.card-actions {
  display: flex;
  gap: 8px;
  margin-top: 2px;
}
.card-actions button, .card-actions a {
  flex: 1;
  font-family: var(--font-mono);
  font-size: 11.5px;
  text-align: center;
  padding: 8px 6px;
  border-radius: 8px;
  border: 1px solid var(--border);
  background: var(--surface-2);
  color: var(--fg);
  cursor: pointer;
  text-decoration: none;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  min-width: 0;
}
.card-actions .view { background: var(--accent); border-color: var(--accent); color: #fff; }
.card-actions .edit-card { background: var(--surface); }
.card-actions .edit-card:hover { border-color: var(--accent); color: var(--accent); }
.card-actions .del-card { color: #e0675f; }

.add-card {
  border: 1px dashed var(--border);
  border-radius: 14px;
  display: none;
  align-items: center;
  justify-content: center;
  min-height: 190px;
  background: transparent;
  color: var(--fg-dim);
  font-family: var(--font-mono);
  font-size: 13px;
  cursor: pointer;
  flex-direction: column;
  gap: 8px;
}
.add-card .plus { font-size: 26px; color: var(--accent); }
.add-card:hover { border-color: var(--accent); color: var(--accent); }
body[data-editing="1"] .add-card { display: flex; }

.empty {
  text-align: center;
  padding: 48px 20px;
  color: var(--fg-dim);
  font-family: var(--font-mono);
  font-size: 13px;
  display: none;
}

/* modal: script reader */
.modal-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.55);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  padding-top: max(20px, env(safe-area-inset-top, 0px));
  z-index: 30;
}
.modal-backdrop[hidden] { display: none; }
.modal {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 14px;
  width: 100%;
  max-width: 640px;
  max-height: 85vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.modal-head {
  padding: 16px 18px;
  border-bottom: 1px solid var(--border);
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 12px;
}
.modal-head h3 {
  font-family: var(--font-display);
  font-size: 18px;
  margin: 0 0 4px;
}
.modal-head p { margin: 0; font-size: 13px; color: var(--fg-dim); }
.modal-close {
  background: var(--surface-2);
  border: 1px solid var(--border);
  color: var(--fg);
  border-radius: 8px;
  width: 30px; height: 30px;
  flex: none;
  cursor: pointer;
  font-size: 15px;
}
.modal-actions {
  padding: 10px 18px;
  display: flex;
  gap: 8px;
  border-bottom: 1px solid var(--border);
}
.modal-actions button {
  font-family: var(--font-mono);
  font-size: 12px;
  background: var(--surface-2);
  border: 1px solid var(--border);
  color: var(--fg);
  border-radius: 7px;
  padding: 7px 12px;
  cursor: pointer;
}
.modal-actions .copy { background: var(--accent); border-color: var(--accent); color: #fff; }
.code-wrap { flex: 1; overflow: auto; background: var(--code-bg); min-width: 0; }
pre.code {
  margin: 0;
  padding: 16px 18px;
  font-family: var(--font-mono);
  font-size: 12.5px;
  line-height: 1.6;
  color: var(--code-fg);
  white-space: pre;
}

/* modal: edit form */
.form-row { padding: 14px 18px; display: flex; flex-direction: column; gap: 4px; }
.form-row label {
  font-family: var(--font-mono);
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--fg-dim);
}
.form-row input, .form-row textarea {
  background: var(--surface-2);
  border: 1px solid var(--border);
  color: var(--fg);
  border-radius: 8px;
  padding: 9px 11px;
  font-size: 13.5px;
  font-family: var(--font-body);
  resize: vertical;
}
.form-row textarea.mono { font-family: var(--font-mono); font-size: 12.5px; min-height: 160px; }
.form-foot { padding: 14px 18px; display: flex; gap: 10px; border-top: 1px solid var(--border); }
.form-foot button {
  font-family: var(--font-mono);
  font-size: 12.5px;
  padding: 9px 16px;
  border-radius: 8px;
  cursor: pointer;
  border: 1px solid var(--border);
}
.form-foot .save { background: var(--accent); border-color: var(--accent); color: #fff; flex: 1; }
.form-foot .cancel { background: var(--surface-2); color: var(--fg); }

/* password gate */
.gate-row { padding: 14px 18px; display: flex; gap: 8px; }
.gate-row input { flex: 1; background: var(--surface-2); border: 1px solid var(--border); color: var(--fg); border-radius: 8px; padding: 9px 11px; font-size: 13.5px; }
.gate-row button { font-family: var(--font-mono); font-size: 12.5px; background: var(--accent); border: 1px solid var(--accent); color: #fff; border-radius: 8px; padding: 9px 14px; cursor: pointer; }
.gate-error { padding: 0 18px 14px; color: #e0675f; font-family: var(--font-mono); font-size: 12px; display: none; }
.lock-note { padding: 0 18px 16px; color: var(--fg-dim); font-size: 12.5px; line-height: 1.5; }

footer {
  margin-top: 40px;
  padding-top: 18px;
  border-top: 1px solid var(--border);
  font-family: var(--font-mono);
  font-size: 11.5px;
  color: var(--fg-dim);
  text-align: center;
}
</style>

<div class="wrap">
  <div class="topbar">
    <div class="brand">
      <span class="mark" id="brand-mark" title="">&gt;_</span>
      <h1>YukiScripts</h1>
    </div>
    <button class="edit-toggle" id="edit-toggle" hidden>✎ Edit mode</button>
  </div>

  <div class="hero">
    <div class="icon">📜</div>
    <h2>Scripts Library</h2>
    <p>your own catalog · view &amp; copy</p>
  </div>

  <div class="search-row">
    <div class="search-box">
      <span class="icn">🔍</span>
      <input id="search" type="text" placeholder="Search by script name or tag…">
    </div>
  </div>

  <div class="grid" id="grid"></div>
  <div class="empty" id="empty">No scripts match your search.</div>
</div>

<!-- password gate modal -->
<div class="modal-backdrop" id="gate-backdrop" hidden>
  <div class="modal" style="max-width: 360px;">
    <div class="modal-head">
      <div><h3>Unlock editing</h3></div>
      <button class="modal-close" id="gate-close">✕</button>
    </div>
    <p class="lock-note">Enter your password to add, edit, or delete scripts. Set one the first time you unlock editing on this device/browser.</p>
    <div class="gate-row">
      <input id="gate-input" type="password" placeholder="Password">
      <button id="gate-submit">Unlock</button>
    </div>
    <div class="gate-error" id="gate-error">Wrong password.</div>
  </div>
</div>

<!-- reader modal -->
<div class="modal-backdrop" id="reader-backdrop" hidden>
  <div class="modal">
    <div class="modal-head">
      <div>
        <h3 id="read-title">—</h3>
        <p id="read-desc">—</p>
      </div>
      <button class="modal-close" id="reader-close">✕</button>
    </div>
    <div class="modal-actions">
      <button class="copy" id="read-copy">Copy source</button>
    </div>
    <div class="code-wrap"><pre class="code" id="read-code"></pre></div>
  </div>
</div>

<!-- edit/add modal -->
<div class="modal-backdrop" id="edit-backdrop" hidden>
  <div class="modal">
    <div class="modal-head">
      <div><h3 id="edit-heading">Add script</h3></div>
      <button class="modal-close" id="edit-close">✕</button>
    </div>
    <div style="overflow:auto;">
      <div class="form-row">
        <label for="f-title">Title</label>
        <input id="f-title" type="text" placeholder="My script">
      </div>
      <div class="form-row">
        <label for="f-desc">Description</label>
        <input id="f-desc" type="text" placeholder="What it does">
      </div>
      <div class="form-row">
        <label for="f-tags">Tags (comma separated)</label>
        <input id="f-tags" type="text" placeholder="lua, utility">
      </div>
      <div class="form-row">
        <label for="f-thumb">Thumbnail URL (optional)</label>
        <input id="f-thumb" type="text" placeholder="https://…">
      </div>
      <div class="form-row">
        <label for="f-photo">Or upload a photo</label>
        <input id="f-photo" type="file" accept="image/*">
        <div id="f-photo-preview" style="display:none; margin-top:6px;">
          <img id="f-photo-img" style="max-width:100%; max-height:120px; border-radius:8px; border:1px solid var(--border);" alt="">
          <button type="button" id="f-photo-clear" style="margin-top:6px; font-family:var(--font-mono); font-size:11px; background:var(--surface-2); border:1px solid var(--border); color:var(--fg); border-radius:6px; padding:5px 10px; cursor:pointer;">Remove photo</button>
        </div>
      </div>
      <div class="form-row">
        <label for="f-code">Source code</label>
        <textarea id="f-code" class="mono" placeholder="-- paste your script here"></textarea>
      </div>
    </div>
    <div class="form-foot">
      <button class="save" id="f-save">Save script</button>
      <button class="cancel" id="f-cancel">Cancel</button>
    </div>
  </div>
</div>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap">

<script>
(function () {
  var STORAGE_KEY = "yukiscripts-library-v1";
  var PASS_KEY = "yukiscripts-pass-hash-v1";
  var editing = false;
  var unlocked = false;
  var scripts = [];
  var editingId = null;
  var pendingPhotoData = "";

  function sha256(text) {
    var enc = new TextEncoder().encode(text);
    return crypto.subtle.digest("SHA-256", enc).then(function (buf) {
      return Array.prototype.map.call(new Uint8Array(buf), function (b) {
        return b.toString(16).padStart(2, "0");
      }).join("");
    });
  }
  function getStoredHash() {
    try { return localStorage.getItem(PASS_KEY) || ""; } catch (e) { return ""; }
  }
  function setStoredHash(h) {
    try { localStorage.setItem(PASS_KEY, h); } catch (e) {}
  }

  function sampleData() {
    return [
      {
        id: "s1",
        title: "Greeting Helper",
        desc: "Prints a time-aware greeting.",
        tags: ["lua", "utility"],
        thumb: "",
        code: "local function greet(name)\n  local hour = tonumber(os.date(\"%H\"))\n  local part = \"evening\"\n  if hour < 12 then part = \"morning\"\n  elseif hour < 18 then part = \"afternoon\" end\n  print(string.format(\"Good %s, %s!\", part, name))\nend\n\ngreet(\"world\")"
      },
      {
        id: "s2",
        title: "FizzBuzz",
        desc: "Classic FizzBuzz for reference.",
        tags: ["lua", "example"],
        thumb: "",
        code: "for i = 1, 30 do\n  if i % 15 == 0 then print(\"FizzBuzz\")\n  elseif i % 3 == 0 then print(\"Fizz\")\n  elseif i % 5 == 0 then print(\"Buzz\")\n  else print(i) end\nend"
      },
      {
        id: "s3",
        title: "Table Dump",
        desc: "Pretty-prints a nested table.",
        tags: ["lua", "debug"],
        thumb: "",
        code: "local function dump(t, indent)\n  indent = indent or \"\"\n  for k, v in pairs(t) do\n    if type(v) == \"table\" then\n      print(indent .. tostring(k) .. \":\")\n      dump(v, indent .. \"  \")\n    else\n      print(indent .. tostring(k) .. \" = \" .. tostring(v))\n    end\n  end\nend\n\ndump({ a = 1, b = { c = 2, d = 3 } })"
      }
    ];
  }

  function load() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (raw) { scripts = JSON.parse(raw); return; }
    } catch (e) {}
    scripts = sampleData();
    save();
  }
  function save() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(scripts)); } catch (e) {}
  }
  function uid() { return "s" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }

  var grid = document.getElementById("grid");
  var empty = document.getElementById("empty");
  var searchInput = document.getElementById("search");
  var editToggle = document.getElementById("edit-toggle");

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function renderGrid() {
    var q = searchInput.value.trim().toLowerCase();
    var filtered = scripts.filter(function (s) {
      if (!q) return true;
      return s.title.toLowerCase().indexOf(q) !== -1 ||
        s.tags.join(" ").toLowerCase().indexOf(q) !== -1 ||
        (s.desc || "").toLowerCase().indexOf(q) !== -1;
    });

    grid.innerHTML = "";
    empty.style.display = (filtered.length === 0 && scripts.length > 0) ? "block" : "none";

    filtered.forEach(function (s) {
      var card = document.createElement("div");
      card.className = "card";
      var thumbInner = s.thumb
        ? '<img src="' + escapeHtml(s.thumb) + '" alt="">'
        : '<span class="ph">{ }</span>';
      card.innerHTML =
        '<div class="thumb">' + thumbInner + '</div>' +
        '<div class="card-body">' +
          '<h3 class="card-title">' + escapeHtml(s.title) + '</h3>' +
          '<div class="card-id">' + escapeHtml(s.tags.length ? s.tags[0] : "script") + ' · ' + s.code.split("\n").length + ' lines</div>' +
          '<div class="card-tags">' + s.tags.map(function (t) { return '<span class="pill">' + escapeHtml(t) + '</span>'; }).join("") + '</div>' +
          '<div class="card-actions">' +
            '<button class="view" data-view="' + s.id + '">▶ View</button>' +
            (editing ? '<button class="edit-card" data-edit="' + s.id + '">✎</button><button class="del-card" data-del="' + s.id + '">🗑</button>' : '') +
          '</div>' +
        '</div>';
      grid.appendChild(card);
    });

    // add card
    var addCard = document.createElement("div");
    addCard.className = "add-card";
    addCard.id = "add-card-btn";
    addCard.innerHTML = '<span class="plus">+</span><span>Add script</span>';
    grid.appendChild(addCard);

    grid.querySelectorAll("[data-view]").forEach(function (btn) {
      btn.addEventListener("click", function () { openReader(btn.getAttribute("data-view")); });
    });
    grid.querySelectorAll("[data-edit]").forEach(function (btn) {
      btn.addEventListener("click", function () { openEditor(btn.getAttribute("data-edit")); });
    });
    grid.querySelectorAll("[data-del]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        if (!unlocked) { openGate(); return; }
        var id = btn.getAttribute("data-del");
        scripts = scripts.filter(function (s) { return s.id !== id; });
        save();
        renderGrid();
      });
    });
    document.getElementById("add-card-btn").addEventListener("click", function () { openEditor(null); });
  }

  // reader modal
  var readerBackdrop = document.getElementById("reader-backdrop");
  var readTitle = document.getElementById("read-title");
  var readDesc = document.getElementById("read-desc");
  var readCode = document.getElementById("read-code");
  var readCopy = document.getElementById("read-copy");
  var currentCode = "";

  function openReader(id) {
    var s = scripts.find(function (x) { return x.id === id; });
    if (!s) return;
    readTitle.textContent = s.title;
    readDesc.textContent = s.desc || "";
    readCode.textContent = s.code;
    currentCode = s.code;
    readCopy.textContent = "Copy source";
    readerBackdrop.hidden = false;
  }
  document.getElementById("reader-close").addEventListener("click", function () { readerBackdrop.hidden = true; });
  readerBackdrop.addEventListener("click", function (e) { if (e.target === readerBackdrop) readerBackdrop.hidden = true; });
  readCopy.addEventListener("click", function () {
    function done() {
      readCopy.textContent = "Copied!";
      setTimeout(function () { readCopy.textContent = "Copy source"; }, 1400);
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(currentCode).then(done).catch(function () {
        var range = document.createRange();
        range.selectNodeContents(readCode);
        var sel = window.getSelection();
        sel.removeAllRanges();
        sel.addRange(range);
      });
    }
  });

  // edit/add modal
  var editBackdrop = document.getElementById("edit-backdrop");
  var editHeading = document.getElementById("edit-heading");
  var fTitle = document.getElementById("f-title");
  var fDesc = document.getElementById("f-desc");
  var fTags = document.getElementById("f-tags");
  var fThumb = document.getElementById("f-thumb");
  var fCode = document.getElementById("f-code");

  function openEditor(id) {
    if (!unlocked) { openGate(); return; }
    editingId = id;
    pendingPhotoData = "";
    document.getElementById("f-photo").value = "";
    document.getElementById("f-photo-preview").style.display = "none";
    if (id) {
      var s = scripts.find(function (x) { return x.id === id; });
      editHeading.textContent = "Edit script";
      fTitle.value = s.title;
      fDesc.value = s.desc || "";
      fTags.value = s.tags.join(", ");
      var isDataUrl = (s.thumb || "").indexOf("data:") === 0;
      fThumb.value = isDataUrl ? "" : (s.thumb || "");
      if (isDataUrl) {
        pendingPhotoData = s.thumb;
        document.getElementById("f-photo-img").src = s.thumb;
        document.getElementById("f-photo-preview").style.display = "block";
      }
      fCode.value = s.code;
    } else {
      editHeading.textContent = "Add script";
      fTitle.value = "";
      fDesc.value = "";
      fTags.value = "";
      fThumb.value = "";
      fCode.value = "";
    }
    editBackdrop.hidden = false;
    fTitle.focus();
  }
  document.getElementById("edit-close").addEventListener("click", function () { editBackdrop.hidden = true; });
  document.getElementById("f-cancel").addEventListener("click", function () { editBackdrop.hidden = true; });
  editBackdrop.addEventListener("click", function (e) { if (e.target === editBackdrop) editBackdrop.hidden = true; });

  document.getElementById("f-save").addEventListener("click", function () {
    if (!unlocked) { openGate(); return; }
    var title = fTitle.value.trim();
    if (!title) { fTitle.focus(); return; }
    var tags = fTags.value.split(",").map(function (t) { return t.trim(); }).filter(Boolean);
    var entry = {
      id: editingId || uid(),
      title: title,
      desc: fDesc.value.trim(),
      tags: tags,
      thumb: pendingPhotoData || fThumb.value.trim(),
      code: fCode.value
    };
    if (editingId) {
      scripts = scripts.map(function (s) { return s.id === editingId ? entry : s; });
    } else {
      scripts.push(entry);
    }
    save();
    editBackdrop.hidden = true;
    renderGrid();
  });

  // password gate
  var gateBackdrop = document.getElementById("gate-backdrop");
  var gateInput = document.getElementById("gate-input");
  var gateSubmit = document.getElementById("gate-submit");
  var gateError = document.getElementById("gate-error");
  var gateClose = document.getElementById("gate-close");
  var lockNote = document.querySelector(".lock-note");

  function openGate() {
    gateError.style.display = "none";
    gateInput.value = "";
    var hasPass = !!getStoredHash();
    lockNote.textContent = hasPass
      ? "Enter your password to add, edit, or delete scripts."
      : "No password set yet on this browser. Choose one now — you'll need it next time you unlock editing here.";
    gateSubmit.textContent = hasPass ? "Unlock" : "Set password";
    gateBackdrop.hidden = false;
    gateInput.focus();
  }
  gateClose.addEventListener("click", function () { gateBackdrop.hidden = true; });
  gateBackdrop.addEventListener("click", function (e) { if (e.target === gateBackdrop) gateBackdrop.hidden = true; });

  function submitGate() {
    var val = gateInput.value;
    if (!val) return;
    var storedHash = getStoredHash();
    if (!storedHash) {
      if (val.length < 4) {
        gateError.textContent = "Use at least 4 characters.";
        gateError.style.display = "block";
        return;
      }
      sha256(val).then(function (h) {
        setStoredHash(h);
        unlocked = true;
        gateBackdrop.hidden = true;
        enterEditing();
      });
      return;
    }
    sha256(val).then(function (h) {
      if (h === storedHash) {
        unlocked = true;
        gateBackdrop.hidden = true;
        enterEditing();
      } else {
        gateError.textContent = "Wrong password.";
        gateError.style.display = "block";
      }
    });
  }
  gateSubmit.addEventListener("click", submitGate);
  gateInput.addEventListener("keydown", function (e) { if (e.key === "Enter") submitGate(); });

  function enterEditing() {
    editing = true;
    document.body.setAttribute("data-editing", "1");
    editToggle.classList.add("on");
    editToggle.textContent = "✓ Editing";
    showEditToggle();
    try { localStorage.setItem(REVEAL_KEY, "1"); } catch (e) {}
    renderGrid();
  }

  // reveal the edit control: either it was unlocked before on this browser,
  // or the brand mark is clicked 5x quickly (a quiet way in, not shown to visitors)
  var REVEAL_KEY = "yukiscripts-reveal-v1";
  function showEditToggle() { editToggle.hidden = false; }
  try {
    if (localStorage.getItem(REVEAL_KEY) === "1") showEditToggle();
  } catch (e) {}

  var brandMark = document.getElementById("brand-mark");
  var tapCount = 0, tapTimer = null;
  brandMark.addEventListener("click", function () {
    tapCount++;
    clearTimeout(tapTimer);
    tapTimer = setTimeout(function () { tapCount = 0; }, 2000);
    if (tapCount >= 5) {
      tapCount = 0;
      showEditToggle();
      openGate();
    }
  });

  // edit mode toggle
  editToggle.addEventListener("click", function () {
    if (editing) {
      editing = false;
      document.body.setAttribute("data-editing", "0");
      editToggle.classList.remove("on");
      editToggle.textContent = "✎ Edit mode";
      renderGrid();
      return;
    }
    if (unlocked) {
      enterEditing();
    } else {
      openGate();
    }
  });

  // photo upload
  var fPhoto = document.getElementById("f-photo");
  var fPhotoPreview = document.getElementById("f-photo-preview");
  var fPhotoImg = document.getElementById("f-photo-img");
  var fPhotoClear = document.getElementById("f-photo-clear");

  fPhoto.addEventListener("change", function () {
    var file = fPhoto.files && fPhoto.files[0];
    if (!file) return;
    if (file.size > 3 * 1024 * 1024) {
      alert("Please choose an image under 3MB.");
      fPhoto.value = "";
      return;
    }
    var reader = new FileReader();
    reader.onload = function (e) {
      pendingPhotoData = e.target.result;
      fPhotoImg.src = pendingPhotoData;
      fPhotoPreview.style.display = "block";
      fThumb.value = "";
    };
    reader.readAsDataURL(file);
  });
  fPhotoClear.addEventListener("click", function () {
    pendingPhotoData = "";
    fPhoto.value = "";
    fPhotoPreview.style.display = "none";
  });

  searchInput.addEventListener("input", renderGrid);

  load();
  renderGrid();
})();
</script>
